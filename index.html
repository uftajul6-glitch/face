<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Presensi Wajah - Supabase</title>

  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#22c55e', 500: '#22c55e', 600: '#16a34a', dark: '#0b0f19', card: '#131d31' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>

<body class="min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#131d31] border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-4 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-500/10 border border-brand-500/30 rounded-2xl text-brand-500 text-xl shadow">
      <i class="fa-solid fa-camera-retro"></i>
    </div>
    <h1 class="text-lg font-bold text-white">Presensi Kehadiran Wajah</h1>
    <p class="text-xs text-gray-400">Posisikan wajah Anda di depan kamera</p>

    <!-- TAMPILAN KAMERA WEBCAM -->
    <div class="relative overflow-hidden rounded-2xl bg-black aspect-video border border-gray-800 shadow-inner flex items-center justify-center">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
    </div>

    <div>
      <input type="text" id="usernameInput" placeholder="Masukkan Nama / Username" class="w-full px-4 py-3 text-xs rounded-xl border border-gray-800 bg-gray-900 focus:outline-none focus:border-brand-500 mb-3 text-center font-semibold">
      <button id="snapBtn" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] text-white rounded-xl text-xs font-bold transition shadow-lg shadow-brand-500/20">
        <i class="fa-solid fa-face-smile mr-1.5"></i> Ambil Foto & Absen
      </button>
    </div>

    <p id="statusMsg" class="text-xs font-medium text-gray-400"></p>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <!-- LOGIKA JAVASCRIPT & SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://ncourmvtmktstcxunwdf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1k5bkybnidsKSBV7784t2Q_E5DNbD3R';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const statusMsg = document.getElementById('statusMsg');

    // 1. Inisialisasi Kamera Perangkat
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { video.srcObject = stream; })
      .catch(err => {
        statusMsg.innerText = "Gagal mengakses kamera: " + err.message;
        statusMsg.className = "text-xs font-medium text-rose-400";
      });

    // 2. Tombol Ambil Foto & Kirim ke Supabase
    document.getElementById('snapBtn').addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      if (!username) {
        alert("Masukkan nama Anda terlebih dahulu!");
        return;
      }

      statusMsg.innerText = "Memproses foto & mengirim data...";
      statusMsg.className = "text-xs font-medium text-yellow-400";

      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      canvas.toBlob(async (blob) => {
        if (!blob) {
          statusMsg.innerText = "Gagal mengambil gambar dari kamera.";
          statusMsg.className = "text-xs font-medium text-rose-400";
          return;
        }

        const fileName = `${username}_${Date.now()}.jpg`;

        // Upload file gambar ke Supabase Storage Bucket 'foto-presensi'
        const { data: uploadData, error: uploadError } = await db.storage
          .from('foto-presensi')
          .upload(fileName, blob, { contentType: 'image/jpeg' });

        if (uploadError) {
          statusMsg.innerText = "Gagal upload foto: " + uploadError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
          return;
        }

        // Dapatkan Public URL dari foto yang diunggah
        const { data: urlData } = db.storage
          .from('foto-presensi')
          .getPublicUrl(fileName);

        const fotoUrl = urlData.publicUrl;

        // Simpan catatan kehadiran ke tabel database 'presensi'
        const { error: dbError } = await db.from('presensi').insert([{
          username: username,
          foto_url: fotoUrl
        }]);

        if (dbError) {
          statusMsg.innerText = "Gagal menyimpan ke database: " + dbError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
        } else {
          statusMsg.innerText = "Presensi Berhasil Dicatat!";
          statusMsg.className = "text-xs font-medium text-emerald-400";
          document.getElementById('usernameInput').value = '';
        }
      }, 'image/jpeg', 0.85);
    });
  </script>
</body>
</html>
