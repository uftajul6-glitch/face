<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Presensi Wajah - Supabase</title>

  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#22c55e', 500: '#22c55e', 600: '#16a34a', dark: '#0b0f19', card: '#131d31' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>

<body class="min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#131d31] border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-4 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-500/10 border border-brand-500/30 rounded-2xl text-brand-500 text-xl shadow">
      <i class="fa-solid fa-location-dot"></i>
    </div>
    <h1 class="text-lg font-bold text-white">Presensi Kehadiran Wajah</h1>
    <p id="subTitle" class="text-xs text-gray-400">Posisikan wajah Anda dengan jelas di depan kamera</p>

    <!-- TAMPILAN KAMERA WEBCAM -->
    <div id="cameraContainer" class="relative overflow-hidden rounded-2xl bg-black aspect-video border border-gray-800 shadow-inner flex items-center justify-center">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
    </div>

    <!-- TAMPILAN SUKSES SELESAI -->
    <div id="successCard" class="hidden py-8 px-4 bg-emerald-500/10 border border-emerald-500/30 rounded-2xl flex flex-col items-center space-y-3">
      <div class="w-16 h-16 bg-emerald-500/20 rounded-full flex items-center justify-center text-emerald-400 text-3xl">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <h2 class="text-lg font-bold text-emerald-400">Presensi Selesai!</h2>
      <p id="successUserText" class="text-xs text-gray-300">Terima kasih, kehadiran beserta lokasi & perangkat Anda telah dicatat.</p>
      <button id="resetBtn" class="mt-2 px-5 py-2.5 bg-gray-800 hover:bg-gray-700 text-white rounded-xl text-xs font-semibold transition border border-gray-700">
        <i class="fa-solid fa-rotate-right mr-1.5"></i> Presensi Lagi
      </button>
    </div>

    <!-- INPUT & TOMBOL -->
    <div id="formSection">
      <input type="text" id="usernameInput" placeholder="Masukkan Nama / Username" class="w-full px-4 py-3 text-xs rounded-xl border border-gray-800 bg-gray-900 focus:outline-none focus:border-brand-500 mb-3 text-center font-semibold">
      <button id="snapBtn" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] text-white rounded-xl text-xs font-bold transition shadow-lg shadow-brand-500/20 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memuat Modul...
      </button>
    </div>

    <p id="statusMsg" class="text-xs font-medium text-yellow-400">Sedang memuat sistem pendeteksi wajah...</p>

    <!-- FOOTER / KREDIT PEMBUAT -->
    <div class="pt-2 border-t border-gray-800/60 text-[11px] text-gray-500">
      Developed by <span class="text-brand-500 font-semibold">Taztsuu</span>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <!-- LOGIKA JAVASCRIPT & SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://ncourmvtmktstcxunwdf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1k5bkybnidsKSBV7784t2Q_E5DNbD3R';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snapBtn');
    const statusMsg = document.getElementById('statusMsg');
    const cameraContainer = document.getElementById('cameraContainer');
    const successCard = document.getElementById('successCard');
    const formSection = document.getElementById('formSection');
    const successUserText = document.getElementById('successUserText');
    const resetBtn = document.getElementById('resetBtn');
    const subTitle = document.getElementById('subTitle');

    let isModelLoaded = false;
    let cameraStream = null;

    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // 1. Inisialisasi Deteksi Wajah
    async function initDetector() {
      try {
        statusMsg.innerText = "Mengunduh modul pendeteksi wajah...";
        await loadScript('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js');

        statusMsg.innerText = "Memuat pendeteksi wajah...";
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

        isModelLoaded = true;
        snapBtn.disabled = false;
        snapBtn.innerHTML = `<i class="fa-solid fa-camera mr-1.5"></i> Ambil Foto & Absen`;
        statusMsg.innerText = "Sistem Siap. Posisikan wajah Anda.";
        statusMsg.className = "text-xs font-medium text-emerald-400";
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Gagal memuat pendeteksi: " + (err.message || "Gagal mengunduh modul");
        statusMsg.className = "text-xs font-medium text-rose-400";
      }
    }

    function startCamera() {
      navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
        .then(stream => { 
          cameraStream = stream;
          video.srcObject = stream; 
          video.onloadeddata = () => {
            if (!isModelLoaded) initDetector();
          };
        })
        .catch(err => {
          statusMsg.innerText = "Gagal mengakses kamera: " + err.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
        });
    }

    function stopCamera() {
      if (cameraStream) {
        cameraStream.getTracks().forEach(track => track.stop());
        cameraStream = null;
      }
    }

    startCamera();

    // Fungsi untuk mendapatkan koordinat lokasi GPS
    function getLoc() {
      return new Promise((resolve) => {
        if (!navigator.geolocation) {
          resolve("GPS tidak didukung browser");
        } else {
          navigator.geolocation.getCurrentPosition(
            (pos) => {
              resolve(`${pos.coords.latitude}, ${pos.coords.longitude}`);
            },
            (err) => {
              resolve("Lokasi ditolak / tidak aktif");
            },
            { timeout: 10000 }
          );
        }
      });
    }

    // 2. Tombol Absen
    snapBtn.addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      if (!username) {
        alert("Masukkan nama Anda terlebih dahulu!");
        return;
      }

      if (!isModelLoaded) {
        alert("Modul pendeteksi belum selesai dimuat, harap tunggu sebentar.");
        return;
      }

      statusMsg.innerText = "Mengambil data lokasi & mendeteksi wajah...";
      statusMsg.className = "text-xs font-medium text-yellow-400";

      // Ambil lokasi GPS secara paralel
      const koordinatLokasi = await getLoc();
      const infoPerangkat = navigator.userAgent;

      // Tangkap frame gambar ke Canvas
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }));

      if (detections.length === 0) {
        statusMsg.innerText = "❌ Gagal: Wajah tidak terdeteksi! Pastikan wajah Anda terlihat jelas.";
        statusMsg.className = "text-xs font-medium text-rose-400";
        return;
      }

      statusMsg.innerText = `✅ Wajah terdeteksi! Mengunggah presensi...`;
      statusMsg.className = "text-xs font-medium text-emerald-400";

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const fileName = `${username}_${Date.now()}.jpg`;

        const { data: uploadData, error: uploadError } = await db.storage
          .from('foto-presensi')
          .upload(fileName, blob, { contentType: 'image/jpeg' });

        if (uploadError) {
          statusMsg.innerText = "Gagal upload foto: " + uploadError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
          return;
        }

        const { data: urlData } = db.storage
          .from('foto-presensi')
          .getPublicUrl(fileName);

        const fotoUrl = urlData.publicUrl;

        // Simpan data lengkap ke database termasuk lokasi dan perangkat
        const { error: dbError } = await db.from('presensi').insert([{
          username: username,
          foto_url: fotoUrl,
          device_info: infoPerangkat,
          lokasi: koordinatLokasi
        }]);

        if (dbError) {
          statusMsg.innerText = "Gagal simpan database: " + dbError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
        } else {
          stopCamera();
          
          cameraContainer.classList.add('hidden');
          formSection.classList.add('hidden');
          successCard.classList.remove('hidden');
          subTitle.innerText = "Status Presensi Hari Ini";
          statusMsg.innerText = "";

          successUserText.innerHTML = `Terima kasih <span class="text-white font-bold capitalize">${username}</span>, kehadiran, perangkat, dan lokasi Anda telah berhasil dicatat.`;
          document.getElementById('usernameInput').value = '';
        }
      }, 'image/jpeg', 0.85);
    });

    resetBtn.addEventListener('click', () => {
      successCard.classList.add('hidden');
      cameraContainer.classList.remove('hidden');
      formSection.classList.remove('hidden');
      subTitle.innerText = "Posisikan wajah Anda dengan jelas di depan kamera";
      statusMsg.innerText = "Sistem Siap. Posisikan wajah Anda.";
      statusMsg.className = "text-xs font-medium text-emerald-400";
      
      startCamera();
    });
  </script>
</body>
</html>
