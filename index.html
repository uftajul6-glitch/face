<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aplikasi Presensi Wajah AI - Supabase</title>

  <!-- Tailwind CSS & Supabase SDK -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { DEFAULT: '#22c55e', 500: '#22c55e', 600: '#16a34a', dark: '#0b0f19', card: '#131d31' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; }
  </style>
</head>

<body class="min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4">

  <div class="w-full max-w-md bg-[#131d31] border border-gray-800 rounded-3xl p-6 shadow-2xl space-y-4 text-center">
    <div class="inline-flex items-center justify-center w-12 h-12 bg-brand-500/10 border border-brand-500/30 rounded-2xl text-brand-500 text-xl shadow">
      <i class="fa-solid fa-face-smile-wink"></i>
    </div>
    <h1 class="text-lg font-bold text-white">Presensi Wajah </h1>
    <p class="text-xs text-gray-400">Posisikan wajah Anda dengan jelas di depan kamera</p>

    <!-- TAMPILAN KAMERA WEBCAM -->
    <div class="relative overflow-hidden rounded-2xl bg-black aspect-video border border-gray-800 shadow-inner flex items-center justify-center">
      <video id="video" autoplay playsinline class="w-full h-full object-cover"></video>
    </div>

    <div>
      <input type="text" id="usernameInput" placeholder="Masukkan Nama / Username" class="w-full px-4 py-3 text-xs rounded-xl border border-gray-800 bg-gray-900 focus:outline-none focus:border-brand-500 mb-3 text-center font-semibold">
      <button id="snapBtn" class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 active:scale-[0.98] text-white rounded-xl text-xs font-bold transition shadow-lg shadow-brand-500/20 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        <i class="fa-solid fa-spinner fa-spin mr-1.5"></i> Memuat AI Detector...
      </button>
    </div>

    <p id="statusMsg" class="text-xs font-medium text-yellow-400">Sedang memuat library AI pendeteksi wajah...</p>

    <!-- FOOTER / KREDIT PEMBUAT -->
    <div class="pt-2 border-t border-gray-800/60 text-[11px] text-gray-500">
      Developed by <span class="text-brand-500 font-semibold">Taztsuu</span>
    </div>
  </div>

  <canvas id="canvas" class="hidden"></canvas>

  <!-- LOGIKA JAVASCRIPT, AI & SUPABASE -->
  <script>
    const SUPABASE_URL = 'https://ncourmvtmktstcxunwdf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_1k5bkybnidsKSBV7784t2Q_E5DNbD3R';
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const snapBtn = document.getElementById('snapBtn');
    const statusMsg = document.getElementById('statusMsg');

    let isModelLoaded = false;

    // Fungsi muat script external dinamis
    function loadScript(src) {
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = src;
        s.onload = resolve;
        s.onerror = reject;
        document.head.appendChild(s);
      });
    }

    // 1. Inisialisasi Library & Model AI
    async function initAI() {
      try {
        statusMsg.innerText = "Mengunduh modul pendeteksi wajah...";
        // Load face-api library secara dinamis dari CDN yang stabil
        await loadScript('https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/dist/face-api.js');

        statusMsg.innerText = "Memuat model AI...";
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model/';
        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

        isModelLoaded = true;
        snapBtn.disabled = false;
        snapBtn.innerHTML = `<i class="fa-solid fa-camera mr-1.5"></i> Ambil Foto & Absen`;
        statusMsg.innerText = "Sistem AI Siap. Posisikan wajah Anda.";
        statusMsg.className = "text-xs font-medium text-emerald-400";
      } catch (err) {
        console.error(err);
        statusMsg.innerText = "Gagal memuat AI: " + (err.message || "Gagal mengunduh script AI");
        statusMsg.className = "text-xs font-medium text-rose-400";
      }
    }

    // 2. Akses Kamera Perangkat
    navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } })
      .then(stream => { 
        video.srcObject = stream; 
        video.onloadeddata = () => initAI();
      })
      .catch(err => {
        statusMsg.innerText = "Gagal mengakses kamera: " + err.message;
        statusMsg.className = "text-xs font-medium text-rose-400";
      });

    // 3. Tombol Ambil Foto dengan Verifikasi Wajah AI
    snapBtn.addEventListener('click', async () => {
      const username = document.getElementById('usernameInput').value.trim().toLowerCase();
      if (!username) {
        alert("Masukkan nama Anda terlebih dahulu!");
        return;
      }

      if (!isModelLoaded) {
        alert("Model AI belum selesai dimuat, harap tunggu sebentar.");
        return;
      }

      statusMsg.innerText = "Mendeteksi wajah...";
      statusMsg.className = "text-xs font-medium text-yellow-400";

      // Tangkap frame gambar dari kamera ke Canvas
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // --- DETEKSI WAJAH MENGGUNAKAN AI ---
      const detections = await faceapi.detectAllFaces(canvas, new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.4 }));

      if (detections.length === 0) {
        statusMsg.innerText = "❌ Gagal: Wajah tidak terdeteksi! Pastikan wajah Anda terlihat jelas.";
        statusMsg.className = "text-xs font-medium text-rose-400";
        return; // Hentikan proses
      }

      statusMsg.innerText = `✅ Wajah terdeteksi! Mengunggah presensi...`;
      statusMsg.className = "text-xs font-medium text-emerald-400";

      // Konversi Canvas ke File Gambar (Blob) & Simpan ke Supabase
      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const fileName = `${username}_${Date.now()}.jpg`;

        // Upload ke Supabase Storage
        const { data: uploadData, error: uploadError } = await db.storage
          .from('foto-presensi')
          .upload(fileName, blob, { contentType: 'image/jpeg' });

        if (uploadError) {
          statusMsg.innerText = "Gagal upload foto: " + uploadError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
          return;
        }

        // Ambil Public URL foto
        const { data: urlData } = db.storage
          .from('foto-presensi')
          .getPublicUrl(fileName);

        const fotoUrl = urlData.publicUrl;

        // Simpan log ke tabel Supabase 'presensi'
        const { error: dbError } = await db.from('presensi').insert([{
          username: username,
          foto_url: fotoUrl
        }]);

        if (dbError) {
          statusMsg.innerText = "Gagal simpan database: " + dbError.message;
          statusMsg.className = "text-xs font-medium text-rose-400";
        } else {
          statusMsg.innerText = "🎉 Presensi Berhasil Dicatat!";
          statusMsg.className = "text-xs font-bold text-emerald-400";
          document.getElementById('usernameInput').value = '';
        }
      }, 'image/jpeg', 0.85);
    });
  </script>
</body>
</html>
